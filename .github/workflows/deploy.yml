name: Deploy to GKE via Kubectl

on:
  push:
    branches:
      - main

env:
  DEPLOYMENT_NAME: my-app-release
  KUBE_NAMESPACE: production

jobs:
  deploy:
    name: Deploy Public Nginx
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC / Workload Identity Federation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate to GCP via Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 2. Get GKE Credentials using your specific Cluster and Zone
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: k8s-app-helm
          location: us-central1-a

      # 3. Apply Kubernetes Manifests & Set Image
      - name: Deploy to Kubernetes
        run: |
          echo "::group::Applying Kubernetes Manifests"
          
          # Create namespace if it doesn't exist
          kubectl create namespace ${{ env.KUBE_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          
          # Apply manifest files (Ensure manifests are located in ./k8s directory)
          kubectl apply -f ./k8s/ -n ${{ env.KUBE_NAMESPACE }}
          
          # Update deployment image tag to public Nginx
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} ${{ env.DEPLOYMENT_NAME }}=nginx:alpine -n ${{ env.KUBE_NAMESPACE }}
          
          echo "::endgroup::"

      # 4. Verify Rollout & Pod Status
      - name: Verify Rollout
        if: always()
        run: |
          echo "::group::GKE Deployment Overview"
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.KUBE_NAMESPACE }} --timeout=180s
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }} -o wide
          echo "::endgroup::"
